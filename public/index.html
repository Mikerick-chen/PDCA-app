<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PDCA Time Master</title>
  <!-- PWA：可安裝到手機主畫面、全螢幕開啟 -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#378add" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="icon" href="/icons/icon-192.png" sizes="192x192" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <!-- iOS：加入主畫面後的圖示、全螢幕與標題 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PDCA" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
  <!-- 深色模式無閃爍（no-FOUC）：在套用樣式前，先依偏好設好 <html data-theme>。 -->
  <script>
    (function () {
      try {
        var p = localStorage.getItem('pdca_theme') || 'system';
        var dark = p === 'dark' || (p !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>
  <!-- 圖示字型改為「本地自帶」（同源、可快取），不再依賴 CDN，避免重新載入時出現方塊（豆腐字）。 -->
  <link rel="preload" href="/vendor/tabler/fonts/tabler-icons.woff2?v3.5.0" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/vendor/tabler/tabler-icons.min.css?v=3" />
  <link rel="stylesheet" href="/css/styles.css?v=16" />
</head>
<body>
  <!-- 應用根容器；實際畫面由 app.js 動態渲染 -->
  <div id="root"></div>

  <!-- 圖表函式庫：改為本地自帶（PWA 離線可用，移除最後一個 CDN 依賴） -->
  <script src="/vendor/chart/chart.umd.min.js?v=1"></script>
  <script src="/js/app.js?v=15"></script>
</body>
</html>
